<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExcaliCursor Overlay</title>
  <style>
    :root {
      --island-bg: rgba(255, 255, 255, 0.96);
      --island-border: rgba(0, 0, 0, 0.08);
      --island-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.14), 0 2px 6px -1px rgba(0, 0, 0, 0.06);
      --text-primary: #1b1b1f;
      --text-muted: #868e96;
      --btn-hover: #f1f0ff;
      --btn-active-bg: #e0dfff;
      --btn-active-fg: #403e6a;
      --divider-color: #e9ecef;
      --pill-bg: #f8f9fa;
      --pill-border: #dee2e6;
    }

    body.dark-ui {
      --island-bg: rgba(35, 35, 41, 0.95);
      --island-border: rgba(255, 255, 255, 0.12);
      --island-shadow: 0 12px 32px -4px rgba(0, 0, 0, 0.48), 0 2px 8px rgba(0, 0, 0, 0.3);
      --text-primary: #e3e3e8;
      --text-muted: #909296;
      --btn-hover: rgba(105, 101, 219, 0.22);
      --btn-active-bg: #403e6a;
      --btn-active-fg: #e0dfff;
      --divider-color: rgba(255, 255, 255, 0.12);
      --pill-bg: #2c2c34;
      --pill-border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, sans-serif;
    }

    #drawing-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      cursor: crosshair;
      transition: opacity 0.14s ease;
    }

    body.tool-hand #drawing-canvas { cursor: grab; }
    body.tool-hand.dragging #drawing-canvas { cursor: grabbing; }
    body.tool-select #drawing-canvas { cursor: default; }
    body.tool-text #drawing-canvas { cursor: text; }
    body.tool-eraser #drawing-canvas { cursor: cell; }
    body.tool-laser #drawing-canvas { cursor: none; }

    body.inactive #drawing-canvas {
      pointer-events: none;
      cursor: default;
    }

    body.inactive.hide-when-inactive #drawing-canvas {
      opacity: 0;
    }

    /* Moveable & Screen-Side Adaptive Excalidraw Island Dock */
    #excali-dock {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      z-index: 200;
      transition: opacity 0.16s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #excali-dock.custom-pos {
      transform: none;
    }

    body.inactive #excali-dock {
      opacity: 0;
      pointer-events: none;
    }

    .excali-island {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 3px;
      padding: 5px 7px;
      background: var(--island-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--island-border);
      border-radius: 12px;
      box-shadow: var(--island-shadow);
      color: var(--text-primary);
      transition: flex-direction 0.16s ease, padding 0.16s ease;
    }

    /* Vertical Orientation when docked near Left or Right screen edge */
    #excali-dock.vertical .excali-island {
      flex-direction: column;
      padding: 7px 5px;
    }

    /* Six-dot Drag Grip Handle */
    #drag-handle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 36px;
      border-radius: 7px;
      color: var(--text-muted);
      cursor: grab;
      transition: color 0.12s ease, background 0.12s ease, transform 0.15s ease;
    }

    #excali-dock.vertical #drag-handle {
      width: 36px;
      height: 20px;
    }

    #excali-dock.vertical #drag-handle svg {
      transform: rotate(90deg);
    }

    #drag-handle:hover {
      color: var(--text-primary);
      background: rgba(128, 128, 128, 0.1);
    }

    #drag-handle:active {
      cursor: grabbing;
    }

    #drag-handle svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .tool-icon-btn {
      position: relative;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      transition: background 0.12s ease, color 0.12s ease, transform 0.08s ease;
    }

    .tool-icon-btn:hover {
      background: var(--btn-hover);
    }

    .tool-icon-btn:active {
      transform: scale(0.95);
    }

    .tool-icon-btn.active {
      background: var(--btn-active-bg);
      color: var(--btn-active-fg);
    }

    .tool-icon-btn.laser-btn.active {
      background: rgba(224, 49, 49, 0.18);
      color: #ff4d4d;
    }

    .tool-icon-btn.danger-btn:hover {
      background: rgba(224, 49, 49, 0.14);
      color: #ff4d4d;
    }

    .tool-icon-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool-icon-btn .key-badge {
      position: absolute;
      right: 3px;
      bottom: 2px;
      font-size: 9px;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1;
      pointer-events: none;
    }

    .tool-icon-btn.active .key-badge {
      color: var(--btn-active-fg);
    }

    .tool-icon-btn.laser-btn.active .key-badge {
      color: #ff4d4d;
    }

    .island-divider {
      width: 1px;
      height: 22px;
      background: var(--divider-color);
      margin: 0 3px;
    }

    #excali-dock.vertical .island-divider {
      width: 22px;
      height: 1px;
      margin: 3px 0;
    }

    /* Popover Anchoring (Auto-flips based on screen edge: top/bottom/left/right) */
    #color-picker-wrapper,
    #more-tools-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #active-color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(128, 128, 128, 0.35);
      box-shadow: 0 0 0 1.5px var(--island-bg) inset;
      transition: transform 0.12s ease;
    }

    .excali-popover {
      position: absolute;
      background: var(--island-bg);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid var(--island-border);
      border-radius: 12px;
      box-shadow: var(--island-shadow);
      color: var(--text-primary);
      display: none;
      z-index: 320;
    }

    .excali-popover.open {
      display: flex;
    }

    /* Horizontal Top Default Popover Position */
    #excali-dock:not(.vertical):not(.dock-bottom) #color-popover {
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
    }
    #excali-dock:not(.vertical):not(.dock-bottom) #more-tools-menu {
      top: calc(100% + 10px);
      right: 0;
    }

    /* Horizontal Bottom Edge Popover Position (opens upward) */
    #excali-dock.dock-bottom:not(.vertical) #color-popover {
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
    }
    #excali-dock.dock-bottom:not(.vertical) #more-tools-menu {
      bottom: calc(100% + 10px);
      right: 0;
    }

    /* Vertical Left Edge Popover Position (opens to the right) */
    #excali-dock.vertical.dock-left #color-popover,
    #excali-dock.vertical.dock-left #more-tools-menu {
      left: calc(100% + 10px);
      bottom: 0;
    }

    /* Vertical Right Edge Popover Position (opens to the left) */
    #excali-dock.vertical.dock-right #color-popover,
    #excali-dock.vertical.dock-right #more-tools-menu {
      right: calc(100% + 10px);
      bottom: 0;
    }

    /* Style Popover Layout (Color, Width, Sloppiness, Fill) */
    #color-popover {
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      width: 224px;
    }

    .style-section {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .style-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    .swatch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
    }

    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid rgba(128, 128, 128, 0.28);
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .color-swatch:hover {
      transform: scale(1.12);
    }

    .color-swatch.active {
      box-shadow: 0 0 0 2px var(--island-bg), 0 0 0 3.5px #6965db;
    }

    .segmented-row {
      display: flex;
      gap: 5px;
    }

    .seg-btn {
      flex: 1;
      height: 26px;
      border: 1px solid var(--pill-border);
      border-radius: 6px;
      background: var(--pill-bg);
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s ease, border-color 0.1s ease;
    }

    .seg-btn:hover {
      background: var(--btn-hover);
    }

    .seg-btn.active {
      background: var(--btn-active-bg);
      border-color: #6965db;
      color: var(--btn-active-fg);
    }

    /* More Tools (⋮) Dropdown Menu */
    #more-tools-menu {
      width: 225px;
      padding: 6px;
      flex-direction: column;
      gap: 2px;
    }

    .menu-item-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 7px 10px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      text-align: left;
      transition: background 0.1s ease;
    }

    .menu-item-btn:hover {
      background: var(--btn-hover);
    }

    .menu-item-btn.active {
      background: var(--btn-active-bg);
      color: var(--btn-active-fg);
      font-weight: 500;
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-item-left svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .menu-item-shortcut {
      font-size: 11px;
      color: var(--text-muted);
    }

    .menu-divider {
      height: 1px;
      background: var(--divider-color);
      margin: 4px 2px;
    }

    /* Subtle Toast Banner for Clipboard Copy & Orientation Switch */
    #toast-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: var(--island-bg);
      color: var(--text-primary);
      border: 1px solid var(--island-border);
      box-shadow: var(--island-shadow);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      z-index: 350;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    #toast-banner.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* On-canvas floating text editor */
    #floating-text-input {
      position: fixed;
      display: none;
      min-width: 120px;
      min-height: 32px;
      padding: 4px 6px;
      border: 1.5px dashed #6965db;
      border-radius: 6px;
      background: var(--island-bg);
      color: var(--text-primary);
      font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive, sans-serif;
      font-size: 22px;
      line-height: 1.25;
      outline: none;
      resize: none;
      overflow: hidden;
      z-index: 250;
    }
  </style>
</head>
<body class="inactive">
  <canvas id="drawing-canvas"></canvas>

  <!-- Clean, Moveable, Auto-Vertical/Horizontal Excalidraw Toolbar -->
  <div id="excali-dock" role="toolbar" aria-label="Excalidraw Tools">
    <div class="excali-island">
      <!-- Drag Grip Handle (Drag to Left/Right edge for Vertical dock, Top/Bottom for Horizontal) -->
      <div id="drag-handle" title="Drag to move (snaps Vertical on Left/Right edges, Horizontal on Top/Bottom) • Double-click to reset">
        <svg viewBox="0 0 16 16">
          <circle cx="5.5" cy="3.5" r="1.2"></circle>
          <circle cx="10.5" cy="3.5" r="1.2"></circle>
          <circle cx="5.5" cy="8" r="1.2"></circle>
          <circle cx="10.5" cy="8" r="1.2"></circle>
          <circle cx="5.5" cy="12.5" r="1.2"></circle>
          <circle cx="10.5" cy="12.5" r="1.2"></circle>
        </svg>
      </div>

      <!-- Lock Tool (Q) -->
      <button class="tool-icon-btn" id="lock-btn" title="Keep selected tool active after drawing (Q)">
        <svg viewBox="0 0 24 24">
          <rect x="5" y="11" width="14" height="10" rx="2"></rect>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
        </svg>
        <span class="key-badge">Q</span>
      </button>

      <div class="island-divider"></div>

      <!-- Hand / Pan Tool (H) -->
      <button class="tool-icon-btn" data-tool="hand" title="Hand — pan canvas (H)">
        <svg viewBox="0 0 24 24">
          <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
          <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
          <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
          <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
        </svg>
        <span class="key-badge">H</span>
      </button>

      <!-- Selection Tool (V / 1) -->
      <button class="tool-icon-btn" data-tool="select" title="Selection (V or 1)">
        <svg viewBox="0 0 24 24">
          <path d="M4 4l7.07 17 2.51-7.39L21 11.07z"></path>
          <path d="M13.58 13.58L19 19"></path>
        </svg>
        <span class="key-badge">V</span>
      </button>

      <!-- Rectangle Tool (R / 2) -->
      <button class="tool-icon-btn" data-tool="rectangle" title="Rectangle (R or 2)">
        <svg viewBox="0 0 24 24">
          <rect x="4" y="5" width="16" height="14" rx="2"></rect>
        </svg>
        <span class="key-badge">R</span>
      </button>

      <!-- Diamond Tool (D / 3) -->
      <button class="tool-icon-btn" data-tool="diamond" title="Diamond (D or 3)">
        <svg viewBox="0 0 24 24">
          <polygon points="12 3 21 12 12 21 3 12"></polygon>
        </svg>
        <span class="key-badge">D</span>
      </button>

      <!-- Ellipse Tool (O / 4) -->
      <button class="tool-icon-btn" data-tool="ellipse" title="Ellipse (O or 4)">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8"></circle>
        </svg>
        <span class="key-badge">O</span>
      </button>

      <!-- Arrow Tool (A / 5) -->
      <button class="tool-icon-btn" data-tool="arrow" title="Arrow (A or 5)">
        <svg viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="13 6 19 12 13 18"></polyline>
        </svg>
        <span class="key-badge">A</span>
      </button>

      <!-- Line Tool (L / 6) -->
      <button class="tool-icon-btn" data-tool="line" title="Line (L or 6)">
        <svg viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span class="key-badge">L</span>
      </button>

      <!-- Draw / Freehand Pencil Tool (P / 7) -->
      <button class="tool-icon-btn active" data-tool="pen" title="Draw — freehand pen (P or 7)">
        <svg viewBox="0 0 24 24">
          <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path>
        </svg>
        <span class="key-badge">P</span>
      </button>

      <!-- Text Tool (T / 8) -->
      <button class="tool-icon-btn" data-tool="text" title="Text (T or 8)">
        <svg viewBox="0 0 24 24">
          <polyline points="4 7 4 4 20 4 20 7"></polyline>
          <line x1="9" y1="20" x2="15" y2="20"></line>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
        <span class="key-badge">T</span>
      </button>

      <!-- Eraser Tool (E / 0) -->
      <button class="tool-icon-btn" data-tool="eraser" title="Eraser (E or 0)">
        <svg viewBox="0 0 24 24">
          <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"></path>
          <path d="M22 21H7"></path>
          <path d="m5 11 9 9"></path>
        </svg>
        <span class="key-badge">E</span>
      </button>

      <!-- Slick Laser Pointer (K) -->
      <button class="tool-icon-btn laser-btn" data-tool="laser" title="Laser pointer (K)">
        <svg viewBox="0 0 24 24">
          <path d="m15 4-3 3 2 2 3-3-2-2Z"></path>
          <path d="m12 7-8.5 8.5a2.12 2.12 0 1 0 3 3L15 10"></path>
          <path d="M18 3v2"></path>
          <path d="M21 6h-2"></path>
          <path d="m20 2-1.5 1.5"></path>
        </svg>
        <span class="key-badge">K</span>
      </button>

      <div class="island-divider"></div>

      <!-- Stroke Color, Stroke Width, Sloppiness & Fill Popover -->
      <div id="color-picker-wrapper">
        <button class="tool-icon-btn" id="color-trigger-btn" title="Stroke Color, Width & Sloppiness">
          <span id="active-color-dot" style="background: #e03131;"></span>
        </button>

        <div id="color-popover" class="excali-popover">
          <div class="style-section">
            <span class="style-label">Stroke Color</span>
            <div class="swatch-row">
              <button class="color-swatch" data-color="#1e1e1e" style="background: #1e1e1e;" title="Ink Black"></button>
              <button class="color-swatch active" data-color="#e03131" style="background: #e03131;" title="Excalidraw Red"></button>
              <button class="color-swatch" data-color="#2f9e44" style="background: #2f9e44;" title="Excalidraw Green"></button>
              <button class="color-swatch" data-color="#1971c2" style="background: #1971c2;" title="Excalidraw Blue"></button>
              <button class="color-swatch" data-color="#f08c00" style="background: #f08c00;" title="Excalidraw Orange"></button>
              <button class="color-swatch" data-color="#6741d9" style="background: #6741d9;" title="Excalidraw Violet"></button>
              <button class="color-swatch" data-color="#ffffff" style="background: #ffffff;" title="Chalk White"></button>
            </div>
          </div>

          <div class="style-section">
            <span class="style-label">Stroke Width</span>
            <div class="segmented-row">
              <button class="seg-btn stroke-width-btn" data-width="1.8">Thin</button>
              <button class="seg-btn stroke-width-btn active" data-width="3.2">Bold</button>
              <button class="seg-btn stroke-width-btn" data-width="5.2">Extra</button>
            </div>
          </div>

          <div class="style-section">
            <span class="style-label">Sloppiness (Roughness)</span>
            <div class="segmented-row">
              <button class="seg-btn roughness-btn" data-roughness="0.35">Architect</button>
              <button class="seg-btn roughness-btn active" data-roughness="1.2">Artist</button>
              <button class="seg-btn roughness-btn" data-roughness="2.3">Cartoon</button>
            </div>
          </div>

          <div class="style-section">
            <span class="style-label">Background Fill</span>
            <div class="segmented-row">
              <button class="seg-btn" id="fill-toggle-btn">Fill: Off</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Dedicated One-Click Clear Canvas Button (C) -->
      <button class="tool-icon-btn danger-btn" id="clear-btn" title="Clear All Drawings (C)">
        <svg viewBox="0 0 24 24">
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
        <span class="key-badge">C</span>
      </button>

      <!-- More Tools (⋮) Menu Button -->
      <div id="more-tools-wrapper">
        <button class="tool-icon-btn" id="more-tools-btn" title="More tools & options">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="5" r="1.2" fill="currentColor"></circle>
            <circle cx="12" cy="12" r="1.2" fill="currentColor"></circle>
            <circle cx="12" cy="19" r="1.2" fill="currentColor"></circle>
          </svg>
        </button>

        <div id="more-tools-menu" class="excali-popover" role="menu">
          <button class="menu-item-btn" data-menu-tool="laser">
            <span class="menu-item-left">
              <svg viewBox="0 0 24 24">
                <path d="m15 4-3 3 2 2 3-3-2-2Z"></path>
                <path d="m12 7-8.5 8.5a2.12 2.12 0 1 0 3 3L15 10"></path>
                <path d="M18 3v2"></path>
                <path d="M21 6h-2"></path>
              </svg>
              <span>Laser pointer</span>
            </span>
            <span class="menu-item-shortcut">K</span>
          </button>

          <button class="menu-item-btn" data-menu-tool="draw-to-shape">
            <span class="menu-item-left">
              <svg viewBox="0 0 24 24">
                <circle cx="9" cy="9" r="5"></circle>
                <rect x="11" y="11" width="9" height="9" rx="1.5"></rect>
              </svg>
              <span>Draw to shape</span>
            </span>
            <span class="menu-item-shortcut">Shift+X</span>
          </button>

          <button class="menu-item-btn" data-menu-tool="bucket">
            <span class="menu-item-left">
              <svg viewBox="0 0 24 24">
                <path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"></path>
                <path d="m5 2 5 5"></path>
                <path d="M2 13h15"></path>
                <path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"></path>
              </svg>
              <span>Bucket fill</span>
            </span>
            <span class="menu-item-shortcut">B</span>
          </button>

          <button class="menu-item-btn" data-menu-tool="lasso">
            <span class="menu-item-left">
              <svg viewBox="0 0 24 24">
                <path d="M7 22a5 5 0 0 1-2-4"></path>
                <path d="M3.3 14A6.8 6.8 0 0 1 2 10c0-4.4 4.5-8 10-8s10 3.6 10 8-4.5 8-10 8a12 12 0 0 1-5-1"></path>
                <circle cx="5" cy="18" r="2"></circle>
              </svg>
              <span>Lasso selection</span>
            </span>
            <span class="menu-item-shortcut"></span>
          </button>

          <div class="menu-divider"></div>

          <button class="menu-item-btn" id="menu-undo-btn">
            <span class="menu-item-left">
              <svg viewBox="0 0 24 24">
                <path d="M3 7v6h6"></path>
                <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
              </svg>
              <span>Undo</span>
            </span>
            <span class="menu-item-shortcut">⌘Z</span>
          </button>

          <button class="menu-item-btn" id="menu-redo-btn">
            <span class="menu-item-left">
              <svg viewBox="0 0 24 24">
                <path d="M21 7v6h-6"></path>
                <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
              </svg>
              <span>Redo</span>
            </span>
            <span class="menu-item-shortcut">⇧⌘Z</span>
          </button>

          <button class="menu-item-btn" id="menu-copy-btn">
            <span class="menu-item-left">
              <svg viewBox="0 0 24 24">
                <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
              </svg>
              <span>Copy canvas PNG</span>
            </span>
            <span class="menu-item-shortcut">⌘C</span>
          </button>

          <div class="menu-divider"></div>

          <button class="menu-item-btn" id="menu-orientation-btn">
            <span class="menu-item-left">
              <svg viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
              </svg>
              <span id="orientation-label">Flip Vertical / Horizontal</span>
            </span>
            <span class="menu-item-shortcut"></span>
          </button>

          <button class="menu-item-btn" id="menu-theme-btn">
            <span class="menu-item-left">
              <svg viewBox="0 0 24 24">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
              </svg>
              <span id="theme-label">Dark Toolbar Theme</span>
            </span>
            <span class="menu-item-shortcut"></span>
          </button>

          <button class="menu-item-btn" id="menu-clear-btn">
            <span class="menu-item-left">
              <svg viewBox="0 0 24 24">
                <path d="M3 6h18"></path>
                <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
              </svg>
              <span>Clear canvas</span>
            </span>
            <span class="menu-item-shortcut">C</span>
          </button>

          <button class="menu-item-btn" id="menu-exit-btn">
            <span class="menu-item-left">
              <svg viewBox="0 0 24 24">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              <span>Exit overlay</span>
            </span>
            <span class="menu-item-shortcut">Esc</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-banner"></div>
  <textarea id="floating-text-input" rows="1" placeholder="Type text..."></textarea>

  <script src="rough.min.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
